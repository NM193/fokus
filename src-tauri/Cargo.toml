[package]
name = "fokus"
version = "0.1.0"
description = "A pastel focus timer"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fokus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"

# The Mac's (a desktop's): a phone has none of these.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
window-vibrancy = "0.6"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# The mini timer is an NSPanel, the only kind of window macOS lets float over
# another app's full screen.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"

# Windows: the title bar's colours and the floating windows' corners (DWM),
# the taskbar's theme (the registry), and the chime (PlaySound).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_System_Registry",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
